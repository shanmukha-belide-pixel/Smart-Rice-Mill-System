<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sri Trimula Rice Mill</title>
    <script>
      // GitHub Pages SPA redirect fix
      // When GitHub Pages returns a 404, this script redirects back to index.html
      // while preserving the URL path so React Router can handle it.
      var segmentCount = 1; // Number of path segments in the base URL (1 for /Smart-Rice-Mill-System/)
      var location = window.location;
      location.replace(
        location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
        location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (location.search ? '&q=' + location.search.slice(1).replace(/&/g, '~and~') : '') +
        location.hash
      );
    </script>
  </head>
  <body></body>
</html>
